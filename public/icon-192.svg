<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="flag-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background tile -->
  <rect width="192" height="192" rx="42" fill="url(#bg)"/>
  <rect width="190" height="190" x="1" y="1" rx="41" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Tricolor Bar at Top -->
  <rect x="24" y="24" width="48" height="4" rx="2" fill="#111827"/>
  <rect x="72" y="24" width="48" height="4" rx="2" fill="#ef4444"/>
  <rect x="120" y="24" width="48" height="4" rx="2" fill="url(#flag-gold)"/>

  <!-- Center Emblem -->
  <circle cx="96" cy="104" r="54" fill="url(#brand)" opacity="0.15" filter="url(#glow)"/>
  <circle cx="96" cy="104" r="46" fill="rgba(255,255,255,0.04)" stroke="rgba(99,102,241,0.4)" stroke-width="2"/>

  <!-- Compass / Book / D-path geometric glyph -->
  <path d="M72 132 L72 76 C72 68 84 66 96 74 C108 66 120 68 120 76 L120 132 C108 125 96 125 96 125 C96 125 84 125 72 132 Z" 
        fill="none" stroke="url(#brand)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="96" y1="74" x2="96" y2="125" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Star accent -->
  <circle cx="96" cy="58" r="4" fill="#fbbf24"/>
</svg>
