<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="brand512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="flag-gold512" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="glow512" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background tile -->
  <rect width="512" height="512" rx="112" fill="url(#bg512)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>

  <!-- Tricolor Bar at Top -->
  <rect x="64" y="64" width="128" height="10" rx="5" fill="#111827"/>
  <rect x="192" y="64" width="128" height="10" rx="5" fill="#ef4444"/>
  <rect x="320" y="64" width="128" height="10" rx="5" fill="url(#flag-gold512)"/>

  <!-- Center Emblem -->
  <circle cx="256" cy="276" r="144" fill="url(#brand512)" opacity="0.18" filter="url(#glow512)"/>
  <circle cx="256" cy="276" r="124" fill="rgba(255,255,255,0.04)" stroke="rgba(99,102,241,0.4)" stroke-width="5"/>

  <!-- Compass / Open Book Glyph -->
  <path d="M192 352 L192 202 C192 182 224 176 256 196 C288 176 320 182 320 202 L320 352 C288 334 256 334 256 334 C256 334 224 334 192 352 Z" 
        fill="none" stroke="url(#brand512)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="256" y1="196" x2="256" y2="334" stroke="#f59e0b" stroke-width="10" stroke-linecap="round"/>
  
  <!-- Star accent -->
  <circle cx="256" cy="154" r="10" fill="#fbbf24"/>
</svg>
